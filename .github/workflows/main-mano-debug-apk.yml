name: Main-mano debug APK

on:
  push:
    branches: [main-mano]

permissions: {}

env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile --no-example
      - name: Build debug APK
        run: flutter build apk --debug --no-pub --dart-define=GIT_COMMIT=${{ github.sha }}
      - name: Upload APK for release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: debug-apk
          path: release
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          tag="main-mano-debug-${RUN_ID}-${ATTEMPT}"
          gh release create "$tag" release/app-debug.apk \
            --target "$COMMIT" --prerelease --latest=false \
            --title "main-mano debug ${RUN_ID} (attempt ${ATTEMPT})" \
            --notes "Debug APK built from commit ${COMMIT}. Debug signing keys may differ between builds."
